name: Build LightingPlus (32-bit + 64-bit)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # hanya dipakai untuk membuat Release saat push tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dengan ndk-build (armeabi-v7a + arm64-v8a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK: $NDK"
          "$NDK/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Susun paket (folder mods)
        run: |
          mkdir -p dist/mods
          cp libs/armeabi-v7a/libLightingPlus.so   dist/mods/
          cp libs/arm64-v8a/libLightingPlus64.so   dist/mods/
          ls -l dist/mods
          (cd dist && zip -r ../LightingPlus.zip mods)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightingPlus
          path: |
            dist/mods/*.so
            LightingPlus.zip

      - name: Buat Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LightingPlus.zip
            dist/mods/libLightingPlus.so
            dist/mods/libLightingPlus64.so
